name: FIAM callback XCTest comparison

on:
  push:
    branches: [validation/fiam-callback-xctest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-unit-tests:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af
      - name: Install CocoaPods dependencies
        run: scripts/setup_bundler.sh
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
      - name: Create iOS simulator
        run: scripts/setup_simulator.sh iOS
      - name: Generate real unit-test workspace
        run: |
          bundle exec pod gen FirebaseInAppMessaging.podspec --platforms=ios \
            --local-sources=./ \
            --sources=https://github.com/firebase/SpecsDev.git,https://github.com/firebase/SpecsStaging.git,https://cdn.cocoapods.org/
          xcodebuild -list -json \
            -workspace gen/FirebaseInAppMessaging/FirebaseInAppMessaging.xcworkspace \
            > unit-workspace.json
      - name: Main-source regression comparison
        run: |
          source_file=FirebaseInAppMessaging/Sources/Flows/FIRIAMDisplayExecutor.m
          cp "$source_file" /tmp/FIRIAMDisplayExecutor-patched.m
          git fetch --no-tags https://github.com/firebase/firebase-ios-sdk.git \
            8d7687f915e31b84ec3dfc816034c3fc571be5e6
          git show 8d7687f915e31b84ec3dfc816034c3fc571be5e6:"$source_file" > "$source_file"
          set +e
          xcodebuild \
            -workspace gen/FirebaseInAppMessaging/FirebaseInAppMessaging.xcworkspace \
            -scheme FirebaseInAppMessaging-Unit-unit \
            -destination 'platform=iOS Simulator,name=Firebase-iPhone-15-Pro' \
            -derivedDataPath /tmp/fiam-callback-derived \
            -resultBundlePath before.xcresult \
            -only-testing:FirebaseInAppMessaging-Unit-unit/FIRIAMDisplayExecutorTests/testDismissalDoesNotLoseNextMessageImpressionDuringReentrantDisplay \
            -only-testing:FirebaseInAppMessaging-Unit-unit/FIRIAMDisplayExecutorTests/testCustomDisplayCanWaitForMainThreadCallback \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO test \
            2>&1 | tee before.log
          before_status=${PIPESTATUS[0]}
          set -e
          cp /tmp/FIRIAMDisplayExecutor-patched.m "$source_file"
          echo "before exit=$before_status" | tee before-status.txt
          test "$before_status" -ne 0
          grep -E "Test Case .*testDismissalDoesNotLoseNextMessageImpressionDuringReentrantDisplay.*failed" before.log
      - name: Patched executor unit tests
        run: |
          xcodebuild \
            -workspace gen/FirebaseInAppMessaging/FirebaseInAppMessaging.xcworkspace \
            -scheme FirebaseInAppMessaging-Unit-unit \
            -destination 'platform=iOS Simulator,name=Firebase-iPhone-15-Pro' \
            -derivedDataPath /tmp/fiam-callback-derived \
            -resultBundlePath after.xcresult \
            -only-testing:FirebaseInAppMessaging-Unit-unit/FIRIAMDisplayExecutorTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO test \
            2>&1 | tee after.log
      - name: Preserve XCTest results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fiam-callback-xctest-results
          path: |
            before.log
            after.log
            before-status.txt
            before.xcresult
            after.xcresult
            unit-workspace.json
